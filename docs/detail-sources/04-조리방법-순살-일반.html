<section class="sm-acc" data-title="조리방법">
  <h3>조리방법</h3>
  <p>냉장 해동 후 흐르는 물에 생선을 헹군 뒤 조리해 주세요.</p>
  <ul>
    <li>프라이팬: 중불에서 생선이 노릇해질 때까지 구워주세요.</li>
    <li>에어프라이어 : 180도 예열 후, 15~20분 익혀주세요.</li>
    <li>전자레인지 : 전용 용기에 넣어 약 3분 돌려주세요.</li>
  </ul>
</section>
