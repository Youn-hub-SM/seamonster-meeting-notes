<section class="sm-acc" data-title="FAQ">
  <h3>FAQ</h3>
  <dl>
    <dt>정말 가시가 없나요?</dt>
    <dd>가시가 적은 부위를 선별하고, 꼼꼼하게 발라냈습니다. 혹시 가시를 발견하신다면 200% 환불해 드립니다.</dd>
    <dt>중금속이나 방사능 위험은 없나요?</dt>
    <dd>대구, 달고기처럼 중금속 함량이 낮은 어종을 사용합니다. 방사능은 자체 소형 장비로 검사하기보다 교육청 주관 무작위 검사 등을 통해 확인하고 있습니다.</dd>
    <dt>갈아야 해서 불편하지 않나요?</dt>
    <dd>씨몬스터는 생물 원물만 사용해 부드럽게 익고, 젓가락이나 숟가락으로도 쉽게 으깨집니다.</dd>
  </dl>
</section>
